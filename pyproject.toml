[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claude-code-tree"
version = "0.1.0"
description = "Terminal UI that browses Claude Code sessions as a fork tree"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Roman Schwarz" }]
keywords = ["claude", "claude-code", "tui", "curses", "sessions", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console :: Curses",
    "Intended Audience :: Developers",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.urls]
Homepage = "https://github.com/rswrz/claude-code-tree"
Repository = "https://github.com/rswrz/claude-code-tree"
Issues = "https://github.com/rswrz/claude-code-tree/issues"

[project.scripts]
claude-code-tree = "cct.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cct"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
